[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerceai-genai-layer"
version = "0.1.0"
description = "AI orchestration layer for CommerceAI using LangGraph, RAG, and intelligent workflows."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=1.2.10",
    "pydantic>=2.0",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
